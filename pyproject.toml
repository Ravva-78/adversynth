[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adversynth"
version = "1.0.0"
description = "Multi-architecture Generative Adversarial Network pipeline for rare pathology synthesis and class imbalance mitigation in clinical ophthalmology."
readme = "README.md"
authors = [{ name = "Arjun Ravva", email = "arjun@adversynth.ai" }]
license = { text = "MIT" }
keywords = ["deep-learning", "gan", "medical-imaging", "ophthalmology", "pytorch", "cyclegan", "cgan", "dcgan"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "numpy>=1.26.0",
    "Pillow>=10.2.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "pytorch-fid>=0.3.0",
    "albumentations>=1.3.1",
    "opencv-python>=4.9.0",
    "pyyaml>=6.0.1",
    "tqdm>=4.66.0",
    "wandb>=0.16.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "flake8>=7.0.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "venv", ".venv", "outputs", "checkpoints", "data"]
